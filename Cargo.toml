[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Lacosst0/bevsidian"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
parley = { version = "0.11", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false }
bevy_radioactive = { git = "https://github.com/Lacosst0/bevy_radioactive", branch = "master", default-features = false, features = ["view", "ui"] }
bevy_ui_textselect = { path = "crates/bevy_ui_textselect" }
bevy_ui_commonmark = { path = "crates/bevy_ui_commonmark" }
bevy_ui_touchscroll = { path = "crates/bevy_ui_touchscroll" }
bevsidian_core = { path = "crates/bevsidian_core" }
bevsidian_graph = { path = "crates/bevsidian_graph" }
bevsidian_preview = { path = "crates/bevsidian_preview" }
bevsidian_ui = { path = "crates/bevsidian_ui" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow"
too_many_arguments = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
items_after_statements = "allow"
too_many_lines = "allow"

[package]
name = "bevsidian"
description = "Obsidian-like documentation vault for Bevy, built with Bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Only the parts of Bevy the app uses (2D rendering, UI, text, picking, scenes): every other
# feature costs compile time, download size and frame time on phones. The `2d` and `ui`
# collections would add animation, gizmos, gamepads, HDR, post-processing, states and more.
bevy = { workspace = true, features = [
    # App and platform
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "bevy_window",
    "custom_cursor",
    "webgl2",
    "x11",
    "wayland",
    "default_font",
    "system_clipboard",
    # Rendering
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite_render",
    "bevy_ui_render",
    # UI, text and input
    "bevy_ui",
    "bevy_text",
    "bevy_ui_widgets",
    "bevy_feathers",
    "bevy_input_focus",
    "bevy_picking",
    "ui_picking",
    "bevy_scene",
    # Sound: the reader's own sound effects, made in code ("Make it yours"), played by the
    # examples.
    "bevy_audio",
    "wav",
] }
bevy_radioactive.workspace = true
bevy_ui_textselect.workspace = true
bevy_ui_commonmark.workspace = true
bevy_ui_touchscroll.workspace = true
bevsidian_core.workspace = true
bevsidian_graph.workspace = true
bevsidian_preview.workspace = true
bevsidian_ui.workspace = true

[lints]
workspace = true

[profile.dev]
opt-level = 1
# Line tables are enough for backtraces, and much cheaper to generate and link.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Profile used for the web build: optimized for speed (phones are CPU-bound). Thin LTO builds
# in less than half the time but makes frames ~8% slower and the download ~25% bigger.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = "debuginfo"
panic = "abort"

# Quick web build for testing: `PROFILE=wasm-dev tools/build-web.sh`.
[profile.wasm-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
strip = "debuginfo"
panic = "abort"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "HtmlElement",
  "HtmlTextAreaElement", "InputEvent", "Location", "Storage", "Window",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
