[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Lacosst0/bevsidian"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
parley = { version = "0.11", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false }
bevy_radioactive = { git = "https://github.com/Lacosst0/bevy_radioactive" }
bevy_ui_textselect = { path = "crates/bevy_ui_textselect" }
bevy_ui_commonmark = { path = "crates/bevy_ui_commonmark" }
bevy_ui_touchscroll = { path = "crates/bevy_ui_touchscroll" }
bevsidian_core = { path = "crates/bevsidian_core" }
bevsidian_graph = { path = "crates/bevsidian_graph" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow"
too_many_arguments = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
items_after_statements = "allow"
too_many_lines = "allow"

[package]
name = "bevsidian"
description = "Obsidian-like documentation vault for Bevy, built with Bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 2D + UI only: the 3D, audio and glTF stacks are not needed and cost frame time and
# download size on phones.
bevy = { workspace = true, features = ["2d", "ui", "system_clipboard", "bevy_feathers"] }
bevy_radioactive.workspace = true
bevy_ui_textselect.workspace = true
bevy_ui_commonmark.workspace = true
bevy_ui_touchscroll.workspace = true
bevsidian_core.workspace = true
bevsidian_graph.workspace = true

[features]
# `cargo run --features dev`: links Bevy as a shared library, so a rebuild only relinks this app.
# Native only.
dev = ["bevy/dynamic_linking"]

[lints]
workspace = true

[profile.dev]
opt-level = 1
# Line tables are enough for backtraces, and much cheaper to generate and link.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Profile used for the web build: optimized for speed (phones are CPU-bound). Thin LTO builds
# in less than half the time but makes frames ~8% slower and the download ~25% bigger.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = "debuginfo"
panic = "abort"

# Quick web build for testing: `PROFILE=wasm-dev tools/build-web.sh`.
[profile.wasm-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
strip = "debuginfo"
panic = "abort"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"] }
js-sys = "0.3"
