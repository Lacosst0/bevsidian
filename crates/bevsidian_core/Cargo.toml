[package]
name = "bevsidian_core"
description = "Vault, navigation state and theme shared by the Bevsidian app crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_ui_widgets", "bevy_text", "bevy_picking", "ui_picking", "bevy_input_focus", "bevy_window", "bevy_log"] }
bevy_radioactive.workspace = true
bevy_ui_commonmark.workspace = true
bevy_ui_textselect.workspace = true
bevy_ui_touchscroll.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"] }

[lints]
workspace = true
