[package]
name = "bevy_ui_textselect"
description = "Mouse and keyboard text selection, clipboard copy and accessibility for rich Bevy UI text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bevy", "ui", "text", "selection", "clipboard"]
categories = ["game-development", "gui"]

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_text",
    "bevy_window",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "bevy_clipboard",
    "bevy_log",
] }
parley.workspace = true
accesskit = "0.24"

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator"] }
