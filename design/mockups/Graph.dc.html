<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bevsidian · Graph view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0a0a0a}
a{color:#a78bfa}a:hover{color:#c4b5fd}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px">
  <header style="height: 48px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,0.1)">
    <button aria-label="Toggle sidebar" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: #a1a1a1; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    <div aria-hidden="true" style="width: 1px; height: 16px; background: rgba(255,255,255,0.1); margin: 0 4px"></div>
    <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 6px; margin-left: 4px; font-size: 14px; color: #a1a1a1">
      <span>Notes</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      <span style="color: #fafafa; font-weight: 500">Graph</span>
    </nav>
    <div style="flex: 1"></div>
    <div role="tablist" aria-label="View" style="display: inline-flex; align-items: center; height: 32px; padding: 3px; box-sizing: border-box; border-radius: 8px; background: #262626">
      <button role="tab" aria-selected="false" style="height: 26px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #a1a1a1; font-size: 13px; font-weight: 500; cursor: pointer">Note</button>
      <button role="tab" aria-selected="true" style="height: 26px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; background: #0a0a0a; color: #fafafa; font-size: 13px; font-weight: 500; cursor: pointer">Graph</button>
    </div>
  </header>

  <div style="position: relative; flex: 1; min-height: 852px; overflow: hidden">
    <svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%">
      <g stroke="rgba(255,255,255,0.16)" stroke-width="1" fill="none">
        <line x1="50" y1="26" x2="34" y2="52" vector-effect="non-scaling-stroke"/>
        <line x1="50" y1="26" x2="64" y2="50" vector-effect="non-scaling-stroke"/>
        <line x1="50" y1="26" x2="48" y2="74" vector-effect="non-scaling-stroke"/>
        <line x1="64" y1="50" x2="48" y2="74" vector-effect="non-scaling-stroke"/>
        <line x1="64" y1="50" x2="80" y2="70" vector-effect="non-scaling-stroke"/>
        <line x1="50" y1="26" x2="24" y2="20" vector-effect="non-scaling-stroke"/>
        <line x1="50" y1="26" x2="72" y2="18" vector-effect="non-scaling-stroke"/>
        <line x1="64" y1="50" x2="84" y2="44" vector-effect="non-scaling-stroke"/>
        <line x1="34" y1="52" x2="18" y2="64" vector-effect="non-scaling-stroke"/>
        <line x1="80" y1="70" x2="84" y2="44" vector-effect="non-scaling-stroke"/>
      </g>
      <g stroke="{{accentLine}}" stroke-width="1.5" fill="none">
        <line x1="34" y1="52" x2="50" y2="26" vector-effect="non-scaling-stroke"/>
        <line x1="34" y1="52" x2="64" y2="50" vector-effect="non-scaling-stroke"/>
        <line x1="34" y1="52" x2="48" y2="74" vector-effect="non-scaling-stroke"/>
      </g>
    </svg>

    <!-- Note nodes -->
    <button style="position: absolute; left: 50%; top: 26%; transform: translate(-50%, -18px); display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #e5e5e5; cursor: pointer; padding: 0">
      <span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: #171717; color: #e5e5e5; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
      <span style="font-size: 12px; line-height: 16px">Welcome</span>
    </button>
    <button aria-current="page" style="position: absolute; left: 34%; top: 52%; transform: translate(-50%, -22px); display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #fafafa; cursor: pointer; padding: 0">
      <span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: {{accent}}; color: #0a0a0a; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px rgba(167,139,250,0.22)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 600">ECS</span>
    </button>
    <button style="position: absolute; left: 64%; top: 50%; transform: translate(-50%, -20px); display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #e5e5e5; cursor: pointer; padding: 0">
      <span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: #171717; color: #e5e5e5; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg></span>
      <span style="font-size: 12px; line-height: 16px">Scenes and BSN</span>
    </button>
    <button style="position: absolute; left: 48%; top: 74%; transform: translate(-50%, -17px); display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #e5e5e5; cursor: pointer; padding: 0">
      <span style="width: 34px; height: 34px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: #171717; color: #e5e5e5; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
      <span style="font-size: 12px; line-height: 16px">Rendering</span>
    </button>
    <button style="position: absolute; left: 80%; top: 70%; transform: translate(-50%, -16px); display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #e5e5e5; cursor: pointer; padding: 0">
      <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: #171717; color: #e5e5e5; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.536 11.293a1 1 0 0 0 0 1.414l2.376 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"/><path d="M2.297 11.293a1 1 0 0 0 0 1.414l2.377 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414L6.088 8.916a1 1 0 0 0-1.414 0z"/><path d="M8.916 17.912a1 1 0 0 0 0 1.415l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.415l-2.377-2.376a1 1 0 0 0-1.414 0z"/><path d="M8.916 4.674a1 1 0 0 0 0 1.414l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"/></svg></span>
      <span style="font-size: 12px; line-height: 16px">UI kit</span>
    </button>

    <!-- Tag nodes -->
    <button style="position: absolute; left: 24%; top: 20%; transform: translate(-50%, -4px); display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; color: #a1a1a1; cursor: pointer; padding: 0">
      <span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #737373; background: #0a0a0a"></span>
      <span style="font-size: 11.5px; line-height: 16px">#beginner</span>
    </button>
    <button style="position: absolute; left: 72%; top: 18%; transform: translate(-50%, -4px); display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; color: #a1a1a1; cursor: pointer; padding: 0">
      <span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #737373; background: #0a0a0a"></span>
      <span style="font-size: 11.5px; line-height: 16px">#start-here</span>
    </button>
    <button style="position: absolute; left: 84%; top: 44%; transform: translate(-50%, -4px); display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; color: #a1a1a1; cursor: pointer; padding: 0">
      <span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #737373; background: #0a0a0a"></span>
      <span style="font-size: 11.5px; line-height: 16px">#ui</span>
    </button>
    <button style="position: absolute; left: 18%; top: 64%; transform: translate(-50%, -4px); display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; color: #a1a1a1; cursor: pointer; padding: 0">
      <span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #737373; background: #0a0a0a"></span>
      <span style="font-size: 11.5px; line-height: 16px">#ecs</span>
    </button>

    <!-- Filters card -->
    <section aria-label="Graph filters" style="position: absolute; left: 16px; top: 16px; width: 264px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; background: #171717; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35)">
      <div style="display: flex; align-items: center; height: 36px; padding: 0 10px; gap: 8px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; background: rgba(255,255,255,0.045); color: #a1a1a1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <label for="graph-filter" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter notes</label>
        <input id="graph-filter" placeholder="Filter notes" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fafafa; font: inherit; font-size: 14px">
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px">Show tags</span>
        <button role="switch" aria-checked="true" aria-label="Show tags" style="width: 32px; height: 18px; border: 0; border-radius: 999px; background: #fafafa; padding: 2px; display: inline-flex; justify-content: flex-end; cursor: pointer"><span style="width: 14px; height: 14px; border-radius: 999px; background: #0a0a0a"></span></button>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px">Only linked to current note</span>
        <button role="switch" aria-checked="false" aria-label="Only linked to current note" style="width: 32px; height: 18px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.15); padding: 2px; display: inline-flex; justify-content: flex-start; cursor: pointer"><span style="width: 14px; height: 14px; border-radius: 999px; background: #fafafa"></span></button>
      </div>
    </section>

    <!-- Zoom controls -->
    <div role="group" aria-label="Zoom" style="position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: #171717; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.35)">
      <button aria-label="Zoom in" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #e5e5e5; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button aria-label="Zoom out" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-top: 1px solid rgba(255,255,255,0.1); background: transparent; color: #e5e5e5; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button aria-label="Fit to view" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-top: 1px solid rgba(255,255,255,0.1); background: transparent; color: #e5e5e5; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg></button>
    </div>

    <!-- Legend -->
    <div style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 16px; height: 32px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: #171717; font-size: 12px; color: #a1a1a1">
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: #0a0a0a; color: #e5e5e5; display: inline-flex; align-items: center; justify-content: center"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/></svg></span>Note</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #737373"></span>Tag</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}}"></span>Current note</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#a78bfa","options":["#a78bfa","#60a5fa","#fafafa","#34d399"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#a78bfa';
    return { accent, accentLine: accent };
  }
}
</script>
</body>
</html>
