<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0a0a0a}
a{color:#a78bfa}a:hover{color:#c4b5fd}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 640px; height: 560px; box-sizing: border-box; position: relative; background: #0a0a0a; color: #fafafa; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>
  <section role="dialog" aria-modal="true" aria-label="Quick switcher" style="position: absolute; left: 60px; top: 56px; width: 520px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; background: #171717; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,0.5)">
    <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #a1a1a1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input aria-label="Search notes, headings and commands" placeholder="Search notes, headings and commands…" value="{{query}}" onChange="{{onQuery}}" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: 0; background: transparent; color: #fafafa; font-size: 14px">
      <kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 1px 5px; border-radius: 4px; background: #262626; color: #a1a1a1">Esc</kbd>
    </div>

    <div role="listbox" aria-label="Results" style="height: 340px; overflow-y: auto; padding: 4px">
      <sc-if value="{{hasNotes}}" hint-placeholder-val="{{ true }}">
        <div style="padding: 8px 8px 4px; font-size: 12px; font-weight: 500; color: #a1a1a1">Notes</div>
        <sc-for list="{{notes}}" as="it" hint-placeholder-count="5">
          <div role="option" aria-selected="{{it.selected}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 6px; background: {{it.bg}}; color: #fafafa; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            <span style="flex: 1">{{it.label}}</span>
            <span style="font-size: 12px; color: #737373">{{it.meta}}</span>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{hasHeadings}}" hint-placeholder-val="{{ true }}">
        <div style="margin-top: 4px; padding: 8px 8px 4px; font-size: 12px; font-weight: 500; color: #a1a1a1">Headings</div>
        <sc-for list="{{headings}}" as="it" hint-placeholder-count="3">
          <div role="option" aria-selected="{{it.selected}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 6px; background: {{it.bg}}; color: #fafafa; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>
            <span style="flex: 1">{{it.label}}</span>
            <span style="font-size: 12px; color: #737373">{{it.meta}}</span>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{hasActions}}" hint-placeholder-val="{{ true }}">
        <div style="margin-top: 4px; padding: 8px 8px 4px; font-size: 12px; font-weight: 500; color: #a1a1a1">Commands</div>
        <sc-for list="{{actions}}" as="it" hint-placeholder-count="3">
          <div role="option" aria-selected="{{it.selected}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 6px; background: {{it.bg}}; color: #fafafa; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            <span style="flex: 1">{{it.label}}</span>
            <kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 1px 5px; border-radius: 4px; background: #262626; color: #a1a1a1">{{it.meta}}</kbd>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 48px 16px; text-align: center; color: #a1a1a1">No results for “{{query}}”.</div>
      </sc-if>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; height: 40px; padding: 0 12px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #a1a1a1">
      <span style="display: inline-flex; align-items: center; gap: 4px"><kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 1px 5px; border-radius: 4px; background: #262626">↑</kbd><kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 1px 5px; border-radius: 4px; background: #262626">↓</kbd> navigate</span>
      <span style="display: inline-flex; align-items: center; gap: 4px"><kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 1px 5px; border-radius: 4px; background: #262626">↵</kbd> open</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '' };
  }
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    const match = (s) => !q || s.toLowerCase().includes(q);
    const notes = [
      { label: 'Welcome', meta: 'Welcome.md' },
      { label: 'ECS', meta: 'ECS.md' },
      { label: 'Rendering', meta: 'Rendering.md' },
      { label: 'Scenes and BSN', meta: 'Scenes and BSN.md' },
      { label: 'UI kit', meta: 'UI kit.md' }
    ].filter((x) => match(x.label));
    const headings = [
      { label: 'Systems', meta: 'ECS' },
      { label: 'Queries', meta: 'ECS' },
      { label: 'Cameras', meta: 'Rendering' }
    ].filter((x) => match(x.label + ' ' + x.meta));
    const actions = [
      { label: 'Open graph view', meta: 'Ctrl G' },
      { label: 'Open settings', meta: 'Ctrl ,' },
      { label: 'Select all text', meta: 'Ctrl A' }
    ].filter((x) => match(x.label));
    let first = true;
    const mark = (list) => list.map((x) => {
      const sel = first;
      first = false;
      return { ...x, selected: sel ? 'true' : 'false', bg: sel ? '#262626' : 'transparent' };
    });
    const n = mark(notes), h = mark(headings), a = mark(actions);
    return {
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      notes: n, headings: h, actions: a,
      hasNotes: n.length > 0, hasHeadings: h.length > 0, hasActions: a.length > 0,
      noResults: n.length + h.length + a.length === 0
    };
  }
}
</script>
</body>
</html>
