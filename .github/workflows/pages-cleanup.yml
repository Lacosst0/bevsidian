name: Pages cleanup

# Removes a branch's page from `gh-pages` when the branch is deleted (see pages.yml).
on:
  delete:

permissions:
  contents: write

concurrency:
  group: pages-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main' && github.event.ref != 'gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove the branch folder
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug="${BRANCH//\//-}"
          [ -d "$slug" ] || { echo "no page for $BRANCH"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq -- "$slug"
          git commit -m "Remove page for deleted branch $BRANCH"
          for attempt in 1 2 3 4 5; do
            git push origin gh-pages && exit 0
            sleep $((attempt * 2))
            git pull --rebase origin gh-pages
          done
          exit 1
