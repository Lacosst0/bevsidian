name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log || {
            { sed 's/\x1b\[[0-9;]*m//g' clippy.log | grep -E -A3 "^(error|warning)" | head -30; } | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        shell: bash
        run: |
          # Failing tests are also reported as annotations, readable without the full log.
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            { sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "panicked|FAILED|error|signal|No space" | head -15; } | sed 's/^/::error::/'
            exit 1
          }
      - name: Check wasm
        run: cargo check --target wasm32-unknown-unknown
