name: Pages

# Publishes the single-file web build to GitHub Pages on every push to `main`.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# For access-controlled ("private") Pages, the repository must belong to an organization on
# GitHub Enterprise Cloud; then choose "Private" under Settings → Pages → Visibility.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the Pages and Release builds. Tag builds can only restore caches
          # saved on the default branch, so they reuse the last `main` build: compiled
          # dependencies are restored and only this workspace and the final link rebuild.
          shared-key: wasm-release
          cache-on-failure: true
      - name: Cache wasm-bindgen and wasm-opt
        uses: actions/cache@v4
        with:
          path: ~/.local/wasm-tools
          key: wasm-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-binaryen-125
      - name: Install wasm-bindgen and wasm-opt
        # wasm-bindgen must match the version in Cargo.lock. Distro binaryen is too old for
        # wasm-bindgen's externref tables, so use a release build. Both are cached above.
        run: |
          tools="$HOME/.local/wasm-tools"
          mkdir -p "$tools"
          if [ ! -x "$tools/wasm-bindgen" ]; then
            version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
            echo "wasm-bindgen $version"
            url="https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
            if ! curl -sSfL "$url" | tar xz --strip-components=1 -C "$tools" "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen"; then
              cargo install wasm-bindgen-cli --version "$version" --locked --root "$tools/cargo"
              cp "$tools/cargo/bin/wasm-bindgen" "$tools/"
            fi
          fi
          if [ ! -d "$tools/binaryen" ]; then
            curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz" | tar xz -C "$tools"
            mv "$tools/binaryen-version_125" "$tools/binaryen"
          fi
          echo "$tools" >> "$GITHUB_PATH"
          echo "$tools/binaryen/bin" >> "$GITHUB_PATH"
      - name: Build single-file web bundle
        run: tools/build-web.sh
      - name: Prepare site
        run: |
          mkdir -p site
          cp dist/index.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
