name: Pages

# Publishes the single-file web build to GitHub Pages, one page per branch:
#   main         -> https://<owner>.github.io/<repo>/
#   other branch -> https://<owner>.github.io/<repo>/<branch>/   (`/` in the name becomes `-`)
# Builds are committed to the `gh-pages` branch; `pages-cleanup.yml` removes a branch's folder
# when the branch is deleted.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "Deploy from a branch",
# Branch: `gh-pages` / (root). The first run creates the branch.
# For access-controlled ("private") Pages, the repository must belong to an organization on
# GitHub Enterprise Cloud; then choose "Private" under Settings → Pages → Visibility.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Per branch: a newer push cancels the older build. The gh-pages push below rebases and retries
  # on conflict, so builds of different branches still run in parallel.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the Pages and Release builds. Tag builds can only restore caches
          # saved on the default branch, so they reuse the last `main` build: compiled
          # dependencies are restored and only this workspace and the final link rebuild.
          shared-key: wasm-release
          cache-on-failure: true
      - name: Cache wasm-bindgen and wasm-opt
        uses: actions/cache@v4
        with:
          path: ~/.local/wasm-tools
          key: wasm-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-binaryen-125
      - name: Install wasm-bindgen and wasm-opt
        # wasm-bindgen must match the version in Cargo.lock. Distro binaryen is too old for
        # wasm-bindgen's externref tables, so use a release build. Both are cached above.
        run: |
          tools="$HOME/.local/wasm-tools"
          mkdir -p "$tools"
          if [ ! -x "$tools/wasm-bindgen" ]; then
            version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
            echo "wasm-bindgen $version"
            url="https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
            if ! curl -sSfL "$url" | tar xz --strip-components=1 -C "$tools" "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen"; then
              cargo install wasm-bindgen-cli --version "$version" --locked --root "$tools/cargo"
              cp "$tools/cargo/bin/wasm-bindgen" "$tools/"
            fi
          fi
          if [ ! -d "$tools/binaryen" ]; then
            curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz" | tar xz -C "$tools"
            mv "$tools/binaryen-version_125" "$tools/binaryen"
          fi
          echo "$tools" >> "$GITHUB_PATH"
          echo "$tools/binaryen/bin" >> "$GITHUB_PATH"
      - name: Build single-file web bundle
        run: tools/build-web.sh
      - name: Publish to gh-pages
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          slug="${BRANCH//\//-}"
          dir="$slug"
          [ "$BRANCH" = main ] && dir="."
          cp dist/index.html "$RUNNER_TEMP/index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git switch --force -C gh-pages FETCH_HEAD
          else
            git switch --orphan gh-pages
            git rm -rf --quiet . || true
          fi
          touch .nojekyll
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/index.html" "$dir/index.html"
          # Build output (`target/`, `dist/`) is untracked here, so `git add -A` would commit it.
          git rm -r -q --cached --ignore-unmatch dist target
          git add .nojekyll "$dir/index.html"
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "Deploy $BRANCH ($GITHUB_SHA)"
          # Other branches may push at the same time: rebase and retry.
          for attempt in 1 2 3 4 5; do
            git push origin gh-pages && exit 0
            sleep $((attempt * 2))
            git pull --rebase origin gh-pages
          done
          exit 1
